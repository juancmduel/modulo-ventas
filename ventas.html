<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Ventas - Registrar Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Módulo de Ventas</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="productos.html">Productos</a>
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link active" href="ventas.html">Ventas</a>
                <a class="nav-link" href="reportes.html">Reportes</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Registrar Venta</h2>
        <form class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Cliente</label>
                <select class="form-select">
                    <option>Juan Perez</option>
                    <option>Maria Lopez</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Producto</label>
                <select class="form-select">
                    <option>Teclado - S/ 45.90</option>
                    <option>Mouse - S/ 25.50</option>
                    <option>Monitor - S/ 550.00</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Cantidad</label>
                <input type="number" class="form-control" value="1" min="1">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Registrar Venta</button>
            </div>
        </form>
    </div>
</body>
</html>
