<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Ventas - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card p-4 shadow-sm" style="width: 100%; max-width: 380px;">
            <h3 class="text-center mb-3">Módulo de Ventas</h3>
            <form onsubmit="return irAlMenu(event)">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="usuario" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="clave" required>
                </div>
                <div id="error" class="text-danger small mb-2" style="display: none;">Usuario o contraseña incorrectos.</div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
            <p class="text-muted small text-center mt-3 mb-0">Usuario: admin / Contraseña: admin</p>
        </div>
    </div>

    <script>
        function irAlMenu(event) {
            event.preventDefault();
            var usuario = document.getElementById('usuario').value;
            var clave = document.getElementById('clave').value;
            if (usuario === 'admin' && clave === 'admin') {
                window.location.href = 'menu.html';
            } else {
                document.getElementById('error').style.display = 'block';
            }
            return false;
        }
    </script>
</body>
</html>
