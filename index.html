<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Ventas - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper d-flex justify-content-center align-items-center">
        <div class="card login-card p-4 shadow">
            <div class="text-center mb-3">
                <div class="login-icon d-inline-flex align-items-center justify-content-center mb-2">
                    <i class="bi bi-shop"></i>
                </div>
                <h3 class="mb-0">Módulo de Ventas</h3>
                <p class="text-muted small">Ingresa tus credenciales</p>
            </div>
            <form onsubmit="return irAlMenu(event)">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="usuario" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="clave" required>
                    </div>
                </div>
                <div id="error" class="text-danger small mb-2" style="display: none;">
                    <i class="bi bi-exclamation-circle"></i> Usuario o contraseña incorrectos.
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
            </form>
            <p class="text-muted small text-center mt-3 mb-0">Usuario: admin / Contraseña: admin</p>
        </div>
    </div>

    <script>
        function irAlMenu(event) {
            event.preventDefault();
            var usuario = document.getElementById('usuario').value;
            var clave = document.getElementById('clave').value;
            if (usuario === 'admin' && clave === 'admin') {
                window.location.href = 'pages/menu.html';
            } else {
                document.getElementById('error').style.display = 'block';
            }
            return false;
        }
    </script>
</body>
</html>
