<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Ventas - Registrar Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="menu.html"><i class="bi bi-shop"></i> Módulo de Ventas</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="menu.html"><i class="bi bi-house"></i> Inicio</a>
                <a class="nav-link" href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
                <a class="nav-link" href="clientes.html"><i class="bi bi-people"></i> Clientes</a>
                <a class="nav-link active" href="ventas.html"><i class="bi bi-cart"></i> Ventas</a>
                <a class="nav-link" href="reportes.html"><i class="bi bi-bar-chart"></i> Reportes</a>
            </div>
            <a class="btn btn-outline-light btn-sm" href="../index.html"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-3"><i class="bi bi-cart"></i> Registrar Venta</h2>
        <div class="card card-panel shadow-sm p-4" style="max-width: 640px;">
            <form class="row g-3">
                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-person"></i> Cliente</label>
                    <select class="form-select">
                        <option>Juan Perez</option>
                        <option>Maria Lopez</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-box-seam"></i> Producto</label>
                    <select class="form-select">
                        <option>Teclado - S/ 45.90</option>
                        <option>Mouse - S/ 25.50</option>
                        <option>Monitor - S/ 550.00</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label"><i class="bi bi-123"></i> Cantidad</label>
                    <input type="number" class="form-control" value="1" min="1">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Registrar Venta
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
